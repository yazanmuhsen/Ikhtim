<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Wooden Stand (Rihal / X-stand) in warm gold/bronze -->
  <g class="stand" stroke="#d97706" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left leg crossing right -->
    <path d="M 28 98 L 60 70 L 92 98" />
    <!-- Stand lower support curve -->
    <path d="M 40 82 Q 60 76 80 82" />
    <!-- Stand upper rest cradling book -->
    <path d="M 32 64 L 60 70 L 88 64" />
  </g>

  <!-- Open Mushaf / Quran Pages in emerald green & gold -->
  <!-- Left Page -->
  <path d="M 60 67 C 46 63, 30 63, 16 68 C 15 52, 17 38, 20 28 C 34 24, 48 24, 60 28 Z" 
        fill="#047857" 
        stroke="#10b981" 
        stroke-width="2" 
        stroke-linejoin="round" />
  
  <!-- Right Page -->
  <path d="M 60 67 C 74 63, 90 63, 104 68 C 105 52, 103 38, 100 28 C 86 24, 72 24, 60 28 Z" 
        fill="#047857" 
        stroke="#10b981" 
        stroke-width="2" 
        stroke-linejoin="round" />

  <!-- Quran Spine Fold & Page Edges in Gold -->
  <path d="M 60 28 L 60 67" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  
  <!-- Golden Text Line Accents on Pages -->
  <g stroke="#fcd34d" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <!-- Left page lines -->
    <line x1="28" y1="36" x2="52" y2="34" />
    <line x1="26" y1="44" x2="52" y2="42" />
    <line x1="26" y1="52" x2="52" y2="50" />
    <line x1="28" y1="60" x2="50" y2="58" />

    <!-- Right page lines -->
    <line x1="68" y1="34" x2="92" y2="36" />
    <line x1="68" y1="42" x2="94" y2="44" />
    <line x1="68" y1="50" x2="94" y2="52" />
    <line x1="70" y1="58" x2="92" y2="60" />
  </g>

  <!-- Misbaha (Prayer Beads) draped gracefully in front -->
  <!-- Beads String Path -->
  <path d="M 38 66 Q 30 78, 38 90 Q 52 100, 68 96 Q 84 90, 80 76" 
        fill="none" 
        stroke="#b45309" 
        stroke-width="1.2" 
        stroke-dasharray="0.5 3" />

  <!-- Individual Prayer Beads (Green & Gold alternating) -->
  <g class="beads" stroke="#78350f" stroke-width="0.8">
    <!-- Loop around left -->
    <circle cx="36" cy="67" r="3.2" fill="#f59e0b" />
    <circle cx="32" cy="73" r="3.2" fill="#10b981" />
    <circle cx="31" cy="79" r="3.2" fill="#f59e0b" />
    <circle cx="33" cy="85" r="3.2" fill="#047857" />
    <circle cx="38" cy="90" r="3.2" fill="#f59e0b" />
    <circle cx="44" cy="94" r="3.2" fill="#10b981" />
    <circle cx="51" cy="96" r="3.2" fill="#f59e0b" />
    <circle cx="58" cy="96" r="3.2" fill="#047857" />
    <circle cx="65" cy="95" r="3.2" fill="#f59e0b" />
    <circle cx="72" cy="92" r="3.2" fill="#10b981" />
    <circle cx="78" cy="87" r="3.2" fill="#f59e0b" />
    <circle cx="81" cy="80" r="3.2" fill="#047857" />
    <circle cx="80" cy="74" r="3.2" fill="#f59e0b" />
  </g>

  <!-- Imam Bead (Separator bead) & Tassel hanging from bottom loop -->
  <!-- Joint / Minaret Bead -->
  <circle cx="51" cy="96" r="3.8" fill="#d97706" stroke="#78350f" stroke-width="0.9" />
  <path d="M 49 98 L 47 104 L 55 104 L 53 98 Z" fill="#f59e0b" stroke="#78350f" stroke-width="0.8" />
  
  <!-- Tassel Ring -->
  <ellipse cx="51" cy="105" rx="3.5" ry="1.5" fill="#d97706" />

  <!-- Tassel Threads in rich Gold & Green -->
  <g stroke-linecap="round" stroke-width="1.8">
    <line x1="48" y1="106" x2="45" y2="116" stroke="#d97706" />
    <line x1="50" y1="106" x2="49" y2="117" stroke="#10b981" />
    <line x1="51" y1="106" x2="51" y2="118" stroke="#f59e0b" />
    <line x1="52" y1="106" x2="53" y2="117" stroke="#047857" />
    <line x1="54" y1="106" x2="57" y2="116" stroke="#d97706" />
  </g>
</svg>
